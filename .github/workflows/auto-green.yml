name: Auto Green Contributions

on:
  schedule:
    # Runs every day at 8:07 PM IST (14:37 UTC)
    - cron: "37 14 * * *"

  workflow_dispatch:
    inputs:
      skip_percentage:
        description: "Chance of skipping today's contribution (0-100)"
        required: false
        default: "10"
        type: string

permissions:
  contents: write

concurrency:
  group: auto-green-main
  cancel-in-progress: true

jobs:
  auto-green:
    name: Create Daily Contribution
    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Generate daily contribution
        env:
          SKIP_PERCENTAGE: ${{ github.event.inputs.skip_percentage || '10' }}
        shell: bash
        run: |
          set -euo pipefail

          # Validate skip percentage
          if ! [[ "$SKIP_PERCENTAGE" =~ ^[0-9]+$ ]] || [ "$SKIP_PERCENTAGE" -gt 100 ]; then
            echo "Invalid SKIP_PERCENTAGE: $SKIP_PERCENTAGE"
            exit 1
          fi

          # Randomly skip some days
          ROLL=$((RANDOM % 100))

          if [ "$ROLL" -lt "$SKIP_PERCENTAGE" ]; then
            echo "Skipping today's contribution."
            exit 0
          fi

          echo "Generating today's contribution..."

          # Use UTC date for a stable daily record
          DATE="$(date -u '+%Y-%m-%d')"
          TIME="$(date -u '+%H:%M:%S UTC')"

          # Prevent duplicate contribution entries for the same day
          if grep -q "^$DATE|" contributions.log 2>/dev/null; then
            echo "A contribution already exists for $DATE."
            exit 0
          fi

          # Add exactly one meaningful daily record
          echo "$DATE|Daily development activity recorded at $TIME" >> contributions.log

          git add contributions.log

          # Nothing changed
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update daily activity"

      - name: Push changes
        run: |
          git push origin HEAD:main
